# Session: Replace NAS with Silent SSD Storage
# Created: 2026-01-30
# Status: active (under evaluation)

created: "2026-01-30"
purpose: "Replace Synology NAS with silent SSD storage attached to Mac mini"
status: active  # active | decided | abandoned

context: |
  The Synology DS224+ NAS is too loud (32dB) for home office use.
  Goal: Move to silent SSD-based storage while maintaining redundancy.

  Key requirements:
  - Zero noise in home office (max 30dB)
  - Maintain 3 copies of critical data, 2 copies of important data
  - Reuse 2×8TB IronWolf HDDs if possible
  - Budget: ~$1000 hardware

