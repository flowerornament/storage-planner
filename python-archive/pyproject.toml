[project]
name = "storage-planner"
version = "0.1.0"
description = "CLI tool for modeling and analyzing storage/backup topologies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "croniter>=2.0.0",
    "humanize>=4.0.0",
]

[project.scripts]
storage-planner = "storage_planner.cli.main:app"
sp = "storage_planner.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default arg (typer pattern)
    "SIM102", # nested if (often clearer than combined)
]

[tool.ruff.lint.per-file-ignores]
"src/storage_planner/cli/*.py" = ["B904"]  # typer.Exit doesn't need chaining

[tool.ruff.lint.isort]
known-first-party = ["storage_planner"]
