name: "Synology NAS Setup"
status: active  # Current deployed state
description: |
  Current system with Synology DS224+ NAS as primary storage.
  NAS has 2×8TB IronWolf HDDs in RAID1 (7TB usable, 3.8TB used).

  Problems:
  - NAS too loud for home office (~32dB)
  - NAS too slow (weak ARM CPU, HDD speeds)
  - HyperBackup to cloud is painfully slow
updated: "2026-01-30"

constraints:
  max_monthly_cost: 140.00
  power_cost_per_kwh: 0.12
  min_critical_data_copies: 3
  min_important_data_copies: 2
  min_locations_for_critical: 2
  max_noise_db_home: 30  # NAS violates this!

nodes:
  - id: macbook-m4
    name: "MacBook Pro M4"
    type: laptop
    status: active
    location: home-office
    power_profile: mobile
    noise_db: 0
    volumes:
      - id: macbook-internal
        name: "Internal SSD"
        type: internal_ssd
        raw_capacity: "1TB"
        usable_capacity: "900GB"
        used: "400GB"
        hosts_datasets:
          - working-files
          - source-code

      - id: macbook-lexar-sl400
        name: "Lexar SL400 Portable"
        type: external_ssd
        raw_capacity: "2TB"
        usable_capacity: "1.8TB"
        used: "1.19TB"
        product_id: lexar-sl400-2tb
        hosts_datasets:
          - hot-storage-sync

  - id: synology-ds224
    name: "Synology DS224+"
    type: nas
    status: active
    location: home-office
    power_profile: always_on
    power_watts_idle: 15
    power_watts_active: 30
    noise_db: 32  # Exceeds constraint!
    problems:
      - "Too loud for home office (32dB, limit is 30dB)"
      - "Slow CPU (ARM) limits performance"
      - "HDD speeds bottleneck transfers"
      - "HyperBackup to cloud is very slow"
    volumes:
      - id: synology-volume1
        name: "RAID1 Array (2×8TB IronWolf)"
        type: raid_array
        raw_capacity: "16TB"
        usable_capacity: "7TB"
        used: "3.8TB"
        raid_level: raid1
        raid_disks: 2
        read_speed: "200MB/s"
        write_speed: "180MB/s"
        hosts_datasets:
          - photos-archive
          - media-library
          - hot-storage-sync
          - project-archives
          - time-machine-backups

  - id: mac-mini-m4
    name: "Mac mini M4"
    type: desktop
    status: active
    location: home-office
    power_profile: always_on
    power_watts_idle: 5
    power_watts_active: 25
    noise_db: 0
    volumes:
      - id: mini-internal
        name: "Internal SSD"
        type: internal_ssd
        raw_capacity: "1TB"
        usable_capacity: "900GB"
        used: "100GB"
        hosts_datasets:
          - service-data
          - postgresql-data
          - sqlite-databases

  - id: eu-server
    name: "Seedhost TG 40TN (NL)"
    type: server
    status: active
    location: eu-datacenter
    power_profile: always_on
    monthly_cost: 125.00
    volumes:
      - id: eu-nvme-boot
        name: "NVMe Boot/Services"
        type: nvme
        raw_capacity: "2TB"
        usable_capacity: "1.8TB"
        hosts_datasets:
          - service-data
          - postgresql-data
          - sqlite-databases
          - working-files
          - source-code

      - id: eu-hdd-array
        name: "HDD Archive Array (4×10TB)"
        type: raid_array
        raw_capacity: "40TB"
        usable_capacity: "30TB"
        raid_level: zfs_raidz1
        hosts_datasets:
          - photos-archive
          - media-library
          - project-archives
          - hot-storage-sync

  - id: google-drive
    name: "Google Workspace"
    type: cloud
    status: active
    location: cloud-google
    monthly_cost: 12.00
    volumes:
      - id: gdrive-backup
        name: "Google Drive Backup"
        type: cloud
        raw_capacity: "2TB"
        usable_capacity: "2TB"
        hosts_datasets:
          - photos-archive
          - postgresql-data
          - sqlite-databases

links:
  - id: home-lan
    node_a: macbook-m4
    node_b: mac-mini-m4
    type: lan
    bandwidth_up: "10Gbps"
    bandwidth_down: "10Gbps"

  - id: macbook-to-nas
    node_a: macbook-m4
    node_b: synology-ds224
    type: lan
    bandwidth_up: "1Gbps"
    bandwidth_down: "1Gbps"

  - id: mini-to-nas
    node_a: mac-mini-m4
    node_b: synology-ds224
    type: lan
    bandwidth_up: "1Gbps"
    bandwidth_down: "1Gbps"

  - id: mini-to-eu
    node_a: mac-mini-m4
    node_b: eu-server
    type: wan
    bandwidth_up: "500Mbps"
    bandwidth_down: "1Gbps"

  - id: mini-to-gdrive
    node_a: mac-mini-m4
    node_b: google-drive
    type: wan
    bandwidth_up: "500Mbps"
    bandwidth_down: "1Gbps"

datasets:
  - id: working-files
    name: "Active Working Files"
    current_size: "50GB"
    growth_rate: "0GB/month"
    criticality: critical
    change_rate: high
    required_copies: 3
    required_locations: 2
    max_rpo: "1h"
    stored_on:
      - macbook-internal
      - synology-volume1
      - eu-nvme-boot

  - id: source-code
    name: "Source Code Repositories"
    current_size: "26GB"
    growth_rate: "0GB/month"
    criticality: critical
    change_rate: high
    required_copies: 3
    required_locations: 2
    max_rpo: "1h"
    stored_on:
      - macbook-internal
      - synology-volume1
      - eu-nvme-boot

  - id: service-data
    name: "Homelab Service Data"
    current_size: "50GB"
    growth_rate: "0GB/month"
    criticality: important
    change_rate: high
    required_copies: 2
    required_locations: 2
    max_rpo: "30m"
    stored_on:
      - mini-internal
      - eu-nvme-boot

  - id: postgresql-data
    name: "PostgreSQL Databases"
    current_size: "10GB"
    growth_rate: "0GB/month"
    criticality: critical
    change_rate: realtime
    required_copies: 3
    required_locations: 3
    max_rpo: "5m"
    stored_on:
      - mini-internal
      - eu-nvme-boot
      - gdrive-backup

  - id: sqlite-databases
    name: "SQLite Databases"
    current_size: "5GB"
    growth_rate: "0GB/month"
    criticality: critical
    change_rate: high
    required_copies: 3
    required_locations: 3
    max_rpo: "5m"
    stored_on:
      - mini-internal
      - eu-nvme-boot
      - gdrive-backup

  - id: hot-storage-sync
    name: "Hot Storage (vault folder)"
    current_size: "1.19TB"
    growth_rate: "0GB/month"
    criticality: important
    change_rate: high
    required_copies: 3
    required_locations: 2
    max_rpo: "1h"
    stored_on:
      - macbook-lexar-sl400
      - synology-volume1
      - eu-hdd-array

  - id: media-library
    name: "Plex Media Library"
    current_size: "371GB"
    growth_rate: "0GB/month"
    criticality: important
    change_rate: low
    required_copies: 2
    required_locations: 2
    max_rpo: "7d"
    stored_on:
      - synology-volume1
      - eu-hdd-array

  - id: photos-archive
    name: "Photos Archive"
    current_size: "900GB"
    growth_rate: "0GB/month"
    criticality: critical
    change_rate: low
    required_copies: 3
    required_locations: 3
    max_rpo: "24h"
    stored_on:
      - synology-volume1
      - eu-hdd-array
      - gdrive-backup

  - id: project-archives
    name: "Completed Project Archives"
    current_size: "716GB"
    growth_rate: "0GB/month"
    criticality: important
    change_rate: static
    required_copies: 2
    required_locations: 2
    max_rpo: "30d"
    stored_on:
      - synology-volume1
      - eu-hdd-array

  - id: time-machine-backups
    name: "Time Machine Backups"
    current_size: "827GB"
    growth_rate: "0GB/month"
    criticality: important
    change_rate: medium
    required_copies: 1
    required_locations: 1
    max_rpo: "24h"
    stored_on:
      - synology-volume1

sync_regimes:
  - id: hot-storage-resilio
    dataset: hot-storage-sync
    source_volume: macbook-lexar-sl400
    target_volumes:
      - synology-volume1
    method: resilio_sync
    direction: bidirectional
    continuous: true
    achieved_rpo: "30s"

  - id: working-files-sync
    dataset: working-files
    source_volume: macbook-internal
    target_volumes:
      - synology-volume1
      - eu-nvme-boot
    method: resilio_sync
    direction: bidirectional
    continuous: true
    achieved_rpo: "30s"

  - id: photos-hyperbackup
    dataset: photos-archive
    source_volume: synology-volume1
    target_volumes:
      - gdrive-backup
    method: manual  # HyperBackup (Synology proprietary)
    direction: source_to_target
    schedule: "0 3 * * *"
    achieved_rpo: "24h"
    notes: "Very slow - Synology CPU bottleneck"

  - id: nas-to-eu-rsync
    dataset: hot-storage-sync
    source_volume: synology-volume1
    target_volumes:
      - eu-hdd-array
    method: rsync
    direction: source_to_target
    schedule: "0 2 * * *"
    achieved_rpo: "24h"

  - id: tm-to-nas
    dataset: time-machine-backups
    source_volume: macbook-internal
    target_volumes:
      - synology-volume1
    method: time_machine
    direction: source_to_target
    continuous: true
    achieved_rpo: "1h"
