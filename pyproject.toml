[project]
name = "storage-planner"
version = "0.1.0"
description = "CLI tool for modeling and analyzing storage/backup topologies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "croniter>=2.0.0",
    "humanize>=4.0.0",
]

[project.scripts]
storage-planner = "storage_planner.cli.main:app"
sp = "storage_planner.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
