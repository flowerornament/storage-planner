[package]
name = "storage-planner"
version = "0.1.0"
edition = "2021"
description = "CLI tool for evaluating storage and purchase decisions"
authors = ["Morgan"]
license = "MIT"

[[bin]]
name = "sp"
path = "src/main.rs"

[dependencies]
# Core (Fast & Light baseline)
anyhow = "1"
xshell = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Filesystem
fs-err = "3"
camino = { version = "1", features = ["serde1"] }

# Terminal output
console = "0.15"

# HTTP (for pricing APIs)
ureq = { version = "2", features = ["json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID for IDs
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

[lints.clippy]
all = "warn"
# Relaxed for gradual cleanup - existing code has dead code
should_implement_trait = "warn"
