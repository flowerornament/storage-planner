[package]
name = "storage-planner"
version = "1.0.1"
edition = "2021"
description = "CLI tool for evaluating storage and purchase decisions"
license = "MIT"

[[bin]]
name = "sp"
path = "src/main.rs"

[dependencies]
# Core
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Terminal output
console = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cron scheduling (for RPO analysis in Plan 02)
croner = "3.0.1"

# UUID for IDs
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

[lints.clippy]
all = "warn"
# Relaxed for gradual cleanup - existing code has dead code
should_implement_trait = "warn"
