    direction: source_to_target
    schedule: "monthly"
    achieved_rpo: "30d"

  # Cloud backups to Google Drive (3rd location)
  - id: photos-gdrive
    dataset: photos-archive
    source_volume: mini-storage
    target_volumes:
      - gdrive-backup
    method: rclone
    software_id: rclone
    direction: source_to_target
    schedule: "0 5 * * *"  # Daily at 5am
    achieved_rpo: "24h"

  - id: postgres-gdrive
    dataset: postgresql-data
