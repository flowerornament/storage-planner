    target_volumes:
      - gdrive-backup
    method: rclone
    software_id: rclone
    direction: source_to_target
    schedule: "0 */6 * * *"  # Every 6 hours
    achieved_rpo: "6h"
    notes: "pg_dump exports, not live replication"

  - id: sqlite-gdrive
    dataset: sqlite-databases
    source_volume: mini-internal
    target_volumes:
      - gdrive-backup
    method: rclone
    software_id: rclone
    direction: source_to_target
    schedule: "0 */6 * * *"  # Every 6 hours
    achieved_rpo: "6h"
    notes: "Litestream snapshots synced to cloud"

  - id: hot-storage-offsite
    dataset: hot-storage-sync
    source_volume: mini-storage
    target_volumes:
      - eu-hdd-array
    method: rsync
    software_id: rsync
    direction: source_to_target
    schedule: "0 2 * * *"  # Daily at 2am
    achieved_rpo: "24h"
    notes: "Offsite backup of hot storage for disaster recovery"
