name: "Morgan's Storage System"
version: "1.0"
description: |
  Personal storage system centered around Mac mini M4 as always-on hub.
  ThunderBay 4 mini provides RAID1 local storage, EU server for offsite.
updated: "2026-01-30"

# ==============================================================================
# Measured Data (from Synology Storage Analyzer 2026-01-30)
# ==============================================================================
# Total NAS usage: 3.8 TB / 7 TB (2×8TB RAID1)
#
# homes share by file type (2.4TB total):
#   Pictures: 903 GB
#   Videos:   761 GB
#   Audio:    608 GB
#   Other:    333 GB (documents, archives, etc.)
#
# vault/ (hot storage) - 1.19TB:
#   Photos:     616 GB (irreplaceable)
#   Video:      224 GB (RAW, irreplaceable)
#   Recordings: 125 GB (irreplaceable)
#   Libraries:  112 GB (replaceable with effort)
#   Downloads:   69 GB (temporary)
#   Samples:     42 GB (replaceable with effort)
#
# sync/ (archival storage) - ~1.14TB:
#   Production: 716 GB (samples, projects, acapellas)
#   Media:      371 GB (films, music, books - replaceable)
#   Projects:    26 GB (code repos, critical)
#   Reference:  352 MB (documents)
#   Archive:    TBD (historical)
#   Downloads:  small
#
# Ishikawa Time Machine backup: 827 GB

constraints:
  max_monthly_cost: 140.00  # €125 Seedhost + ~$12 Google Workspace 2TB
  power_cost_per_kwh: 0.12
  min_critical_data_copies: 3  # 3 copies for irreplaceables (local + EU + cloud)
  min_important_data_copies: 2
  min_locations_for_critical: 2  # Base requirement; irreplaceables explicitly set to 3
  max_noise_db_home: 30
  local_storage_budget: "8TB"  # Replacing 8TB NAS (3.8TB used) - need headroom for growth
  hardware_budget: 1000  # USD, one-time
  local_redundancy: false  # Offsite copies (EU + Google) sufficient; no RAID needed

# ==============================================================================
# Problems - Active issues to solve
# ==============================================================================
problems:
  - id: replace-synology-nas
    title: "Replace Synology DS224+ NAS"
    status: active
    description: |
      Current Synology DS224+ with 2×8TB RAID1 (7TB usable, 3.8TB used) needs
      replacement. NAS is too loud for home office and too slow (weak CPU, HDD).
      Mac mini M4 + external SSD will replace it as storage hub.
    affects:
      - mac-mini-m4
    discovered: "2025-01-29"

# ==============================================================================
# Decisions - Institutional knowledge
# ==============================================================================
decisions:
  - date: "2025-01-29"
    title: "Mac mini M4 as storage hub"
    choice: |
      Use Mac mini M4 as always-on hub with external SSD storage.
      Single drive (no RAID) - offsite copies provide redundancy.
    rationale: |
      Silent operation priority for home office. Mac mini fanless in most
      conditions, matches aesthetic, serves as homelab server.
      Local RAID1 too expensive given offsite redundancy already exists
      (EU server + Google Drive).
    alternatives_considered:
      - "Keep Synology NAS in closet with long cables"
      - "QNAP silent NAS"
      - "RAID1 for local redundancy (rejected: cost, offsite sufficient)"
    hardware_options:
      - "8TB portable SSD (Samsung T5 EVO ~$650, SanDisk Extreme ~$650)"
      - "8TB NVMe + enclosure (Lexar NM790 8TB ~$644 + enclosure ~$55-120)"
      - "2×4TB NVMe in multi-bay enclosure (if RAID1 wanted later)"

  - date: "2026-01-30"
    title: "No local RAID - offsite is the redundancy"
    choice: |
      Single SSD locally, rely on offsite copies for redundancy.
    rationale: |
      Local RAID1 doubles drive cost for protection against drive failure.
      But with nightly backups to EU server + cloud backup to Google Drive,
      a local drive failure means at most 24h of data loss and a few hours
      of restore time. That's acceptable for the cost savings.

      Protection layers:
      1. EU server: nightly rsync/borg (RAIDZ1 on server side)
      2. Google Drive: daily photos, 6-hourly database dumps
      3. Versioning via Borg for point-in-time recovery

      Local drive failure recovery: restore from EU server over WAN.
    alternatives_considered:
      - "RAID1 for instant local recovery (rejected: ~$250 extra for marginal benefit)"
      - "Keep 3 local copies (rejected: same cost concern)"

  - date: "2026-01-30"
    title: "Google Drive for irreplaceable data"
    choice: |
      Add Google Workspace 2TB as 3rd location for irreplaceable data:
      photos-archive, postgresql-data, sqlite-databases.
      Use rclone for scheduled sync (daily photos, 6-hourly databases).
    rationale: |
      True 3-location protection for irreplaceable data covers the
      "simultaneous loss of home + EU datacenter" scenario. Cloud backup
      via Google provides:
      - Different infrastructure provider (not self-hosted)
      - Geographic redundancy (Google's multi-region)
      - Enables downgrade from 5TB to 2TB plan (cost savings)

      Working-files and source-code remain 2-location because:
      - High change rate makes cloud sync expensive/slow
      - Source code has implicit redundancy via git remotes (GitHub)
    alternatives_considered:
      - "Backblaze B2 (~$5/TB/mo) - cheaper but less integrated"
      - "Keep 5TB Google plan - unnecessary, 2TB sufficient"

# ==============================================================================
# Nodes
# ==============================================================================
nodes:
  # MacBook Pro - Mobile workstation
  - id: macbook-m4
    name: "MacBook Pro M4"
    type: laptop
    status: active
    location: home-office
    power_profile: mobile
    noise_db: 0
    volumes:
      - id: macbook-internal
        name: "Internal SSD"
        type: internal_ssd
        raw_capacity: "1TB"
        usable_capacity: "900GB"
        used: "400GB"
        read_speed: "7000MB/s"
        write_speed: "5000MB/s"
        hosts_datasets:
          - working-files
          - source-code

      - id: macbook-lexar-sl400
        name: "Lexar SL400 Portable"
        type: external_ssd
        raw_capacity: "2TB"
        usable_capacity: "1.8TB"
        used: "1.19TB"  # Measured: vault folder total
        product_id: lexar-sl400-2tb
        read_speed: "1050MB/s"
        write_speed: "1000MB/s"
        hosts_datasets:
          - hot-storage-sync

  # Mac mini M4 - Storage hub + homelab server
  - id: mac-mini-m4
    name: "Mac mini M4 Hub"
    type: desktop
    status: active
    location: home-office
    power_profile: always_on
    power_watts_idle: 5
    power_watts_active: 25
    noise_db: 0
    volumes:
      - id: mini-internal
        name: "Internal SSD (Services)"
        type: internal_ssd
        raw_capacity: "1TB"
        usable_capacity: "900GB"
        used: "100GB"
        read_speed: "7000MB/s"
        write_speed: "5000MB/s"
        hosts_datasets:
          - service-data
          - postgresql-data
          - sqlite-databases

      - id: mini-storage
        name: "External Storage (NAS Replacement)"
        type: external_ssd
        raw_capacity: "8TB"
        usable_capacity: "7.3TB"
        used: "3.8TB"  # Measured: Total NAS usage from Synology
        # product_id: TBD - single SSD, no RAID (offsite provides redundancy)
        read_speed: "1000MB/s"  # Typical USB 3.2 Gen 2 portable SSD
        write_speed: "1000MB/s"
        # Replaces: Synology DS224+ with 2×8TB RAID1
        hosts_datasets:
          - photos-archive
          - media-library
          - hot-storage-sync
          - project-archives
          - source-code

      - id: mini-tm-drive
        name: "Time Machine Drive"
        type: external_ssd
        raw_capacity: "2TB"
        usable_capacity: "1.8TB"
        used: "827GB"  # Measured: current TM backup size
        # Could be separate drive or partition on RAID enclosure
        hosts_datasets:
          - time-machine-backups

      - id: emergency-recovery
        name: "Emergency Recovery Drive"
        type: external_ssd
        raw_capacity: "1TB"
        usable_capacity: "900GB"
        hosts_datasets:
          - emergency-bootable

  # EU Server - Offsite backup (Seedhost TG 40TN)
  - id: eu-server
    name: "Seedhost TG 40TN (NL)"
    type: server
    status: active
    location: eu-datacenter
    power_profile: always_on
    monthly_cost: 125.00  # €125/mo
    notes: |
      Seedhost TG 40TN plan:
      - 2× Xeon Gold 5118 (24c/48t total @ 2.3GHz)
      - 64GB RAM
      - 2TB NVMe SSD + 4×10TB HDD
      - 100TB monthly traffic
    volumes:
      - id: eu-nvme-boot
        name: "NVMe Boot/Services"
        type: nvme
        raw_capacity: "2TB"
        usable_capacity: "1.8TB"
        read_speed: "3500MB/s"
        write_speed: "3000MB/s"
        hosts_datasets:
          - service-data
          - postgresql-data
          - sqlite-databases
          - working-files
          - source-code

      - id: eu-hdd-array
        name: "HDD Archive Array (4×10TB)"
        type: raid_array
        raw_capacity: "40TB"
        usable_capacity: "30TB"
        raid_level: zfs_raidz1
        raid_disks: 4
        hosts_datasets:
          - time-machine-backups
          - photos-archive
          - media-library
          - project-archives

  # Google Drive - Cloud backup for irreplaceables
  - id: google-drive
    name: "Google Workspace"
    type: cloud
    status: active
    location: cloud-google
    power_profile: always_on
    monthly_cost: 12.00  # Google Workspace 2TB tier (potential downgrade from 5TB)
    volumes:
      - id: gdrive-backup
        name: "Google Drive Backup"
        type: cloud
        raw_capacity: "2TB"
        usable_capacity: "2TB"
        used: "915GB"  # Calculated: photos 900GB + postgres 10GB + sqlite 5GB
        hosts_datasets:
          - photos-archive
          - postgresql-data
          - sqlite-databases

  # Cold Storage - 8TB HDDs (occasional use)
  - id: hdd-cold-storage
    name: "Cold Storage Enclosure"
    type: desktop
    status: active
    location: home-office
    power_profile: on_demand
    noise_db: 32
    problems:
      - "Noisy when running - only use for occasional archive access"
    volumes:
      - id: hdd-archive-1
        name: "IronWolf 8TB #1"
        type: external_hdd
        raw_capacity: "8TB"
        usable_capacity: "7.3TB"
        product_id: seagate-ironwolf-8tb
        hosts_datasets:
          - cold-archives

      - id: hdd-archive-2
        name: "IronWolf 8TB #2"
        type: external_hdd
        raw_capacity: "8TB"
        usable_capacity: "7.3TB"
        product_id: seagate-ironwolf-8tb
        hosts_datasets:
          - offsite-rotation

# ==============================================================================
# Network Links
# ==============================================================================
links:
  - id: home-lan
    node_a: macbook-m4
    node_b: mac-mini-m4
    type: lan
    bandwidth_up: "10Gbps"
    bandwidth_down: "10Gbps"
    latency_ms: 1

  - id: thunderbolt-storage
    node_a: mac-mini-m4
    node_b: mac-mini-m4
    type: thunderbolt
    bandwidth_up: "40Gbps"
    bandwidth_down: "40Gbps"
    latency_ms: 0

  - id: mini-to-eu
    node_a: mac-mini-m4
    node_b: eu-server
    type: wan
    bandwidth_up: "500Mbps"
    bandwidth_down: "1Gbps"
    latency_ms: 30

  - id: macbook-to-eu
    node_a: macbook-m4
    node_b: eu-server
    type: wan
    bandwidth_up: "500Mbps"
    bandwidth_down: "1Gbps"
    latency_ms: 30

  - id: mini-to-gdrive
    node_a: mac-mini-m4
    node_b: google-drive
    type: wan
    bandwidth_up: "500Mbps"
    bandwidth_down: "1Gbps"
    latency_ms: 50

