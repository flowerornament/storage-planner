# ==============================================================================
# Sync Regimes
# ==============================================================================
sync_regimes:
  - id: hot-storage-resilio
    dataset: hot-storage-sync
    source_volume: macbook-lexar-sl400
    target_volumes:
      - mini-storage
    method: resilio_sync
    software_id: resilio_sync
    direction: bidirectional
    continuous: true
    achieved_rpo: "30s"

  - id: working-files-sync
    dataset: working-files
    source_volume: macbook-internal
    target_volumes:
      - mini-storage
      - eu-nvme-boot
    method: resilio_sync
    software_id: resilio_sync
    direction: bidirectional
    continuous: true
    achieved_rpo: "30s"

  - id: code-sync
    dataset: source-code
    source_volume: macbook-internal
    target_volumes:
      - eu-nvme-boot
    method: resilio_sync
    software_id: resilio_sync
    direction: bidirectional
    continuous: true
    achieved_rpo: "30s"

  - id: postgres-streaming
    dataset: postgresql-data
    source_volume: mini-internal
    target_volumes:
      - eu-nvme-boot
    method: postgres_replication
    software_id: postgres_replication
    direction: source_to_target
    continuous: true
    achieved_rpo: "5m"

  - id: sqlite-litestream
    dataset: sqlite-databases
    source_volume: mini-internal
    target_volumes:
      - eu-nvme-boot
    method: litestream
    software_id: litestream
    direction: source_to_target
    continuous: true
    achieved_rpo: "5m"

  - id: service-data-sync
    dataset: service-data
    source_volume: mini-internal
    target_volumes:
      - eu-nvme-boot
    method: rsync
    software_id: rsync
    direction: source_to_target
    schedule: "*/15 * * * *"
    achieved_rpo: "15m"

  - id: tm-macbook
    dataset: time-machine-backups
    source_volume: macbook-internal
    target_volumes:
      - mini-tm-drive
    method: time_machine
    software_id: time_machine
    direction: source_to_target
    continuous: true
    achieved_rpo: "1h"

  - id: tm-offsite
    dataset: time-machine-backups
    source_volume: mini-tm-drive
    target_volumes:
      - eu-hdd-array
    method: rsync
    software_id: rsync
    direction: source_to_target
    schedule: "0 4 * * *"
    achieved_rpo: "24h"

  - id: photos-borg
    dataset: photos-archive
    source_volume: mini-storage
    target_volumes:
      - eu-hdd-array
    method: borg
    software_id: borg
    direction: source_to_target
    schedule: "0 3 * * *"
    achieved_rpo: "24h"

  - id: media-rsync
    dataset: media-library
    source_volume: mini-storage
    target_volumes:
      - eu-hdd-array
    method: rsync
    software_id: rsync
    direction: source_to_target
    schedule: "0 3 * * 0"
    achieved_rpo: "7d"

  - id: archives-borg
    dataset: project-archives
    source_volume: mini-storage
    target_volumes:
      - eu-hdd-array
    method: borg
    software_id: borg
    direction: source_to_target
    schedule: "0 2 * * 0"
    achieved_rpo: "7d"

  - id: offsite-rotation-manual
    dataset: offsite-rotation
    source_volume: mini-storage
    target_volumes:
      - hdd-archive-2
